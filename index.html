<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SGEN — Sound Generator</title>
<link rel="stylesheet" href="css/app.css">
<script>
// Запасной вариант для браузеров без CanvasRenderingContext2D.roundRect
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        var rr = Math.min(typeof r === 'number' ? r : 0, Math.abs(w) / 2, Math.abs(h) / 2);
        this.moveTo(x + rr, y);
        this.arcTo(x + w, y, x + w, y + h, rr);
        this.arcTo(x + w, y + h, x, y + h, rr);
        this.arcTo(x, y + h, x, y, rr);
        this.arcTo(x, y, x + w, y, rr);
        this.closePath();
    };
}
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23080a0e'/%3E%3Cpath d='M6 16h3l2-7 3 14 3-11 2 6h4' stroke='%2339d0a4' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>

<header class="topbar">
    <div class="brand">S<span>GEN</span></div>

    <div class="transport">
        <button id="play" class="btn primary" type="button">Пуск</button>
        <button id="stop" class="btn" type="button">Стоп</button>
    </div>

    <label class="master" for="master">
        <span>Громкость</span>
        <input id="master" type="range" min="0" max="1" step="0.01" value="0.8">
    </label>

    <div class="stats">
        <span id="statVoices">голосов: 0</span>
        <span id="statRate">—</span>
        <span id="statLatency">—</span>
    </div>

    <div class="actions">
        <button id="share" class="btn ghost" type="button">Ссылка</button>
        <button id="save" class="btn ghost" type="button">Сохранить</button>
    </div>
</header>

<main>
    <section class="visuals">
        <div class="panel">
            <div class="panel-head">
                <h2>Сигнал</h2>
                <span class="hint">триггер по нулю</span>
            </div>
            <canvas id="scopeLive" class="scope"></canvas>
        </div>

        <div class="panel">
            <div class="panel-head">
                <h2>Замершая волна</h2>
                <button id="freeze" class="btn tiny" type="button">Заморозить</button>
            </div>
            <canvas id="scopeFrozen" class="scope"></canvas>
        </div>

        <div class="panel spectrum-panel">
            <div class="panel-head">
                <h2>Спектр</h2>
                <span class="hint">20 Гц — 20 кГц · удержание пиков</span>
            </div>
            <canvas id="spectrum" class="spectrum"></canvas>
        </div>
    </section>

    <section class="gens">
        <div class="gens-head">
            <h2>Генераторы</h2>
            <button id="add" class="btn" type="button">+ Добавить генератор</button>
        </div>

        <div id="cards" class="cards"></div>
        <p id="empty" class="empty" hidden>Генераторов нет. Нажми «Добавить генератор».</p>
    </section>
</main>

<div id="toast" class="toast" hidden></div>

<noscript>
    <p style="padding:24px;color:#dbe4ef">Для работы SGEN нужен JavaScript.</p>
</noscript>

<script type="module" src="js/main.js"></script>
</body>
</html>
